name: Building kernel
run-name: "Building kernel (${{ inputs.KBRANCH }}) #${{ github.run_number }}${{ inputs.NOTES && format(' - {0}', inputs.NOTES) || '' }}"

on:
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'Compiler to use'
        required: true
        default: 'Proton-Clang'
      KREPO:
        description: 'Kernel repo URL'
        required: true
        default: 'https://github.com/dickygunardi388-alt/hydrogen_kernel_xiaomi_selene'
      KBRANCH:
        description: 'Kernel branch'
        required: true
        default: 'Hydrogen'
      NOTES:
        description: 'Extra notes (printed in build log)'
        required: false
        default: ''
      VERBOSE:
        description: 'Enable verbose logging (leave blank to disable)'
        required: false
        default: ''
      ZREPO:
        description: 'Custom AnyKernel3 repo (leave blank = use default from env)'
        required: false
        default: ''
      ZBRANCH:
        description: 'Custom AnyKernel3 branch (leave blank = use default from env)'
        required: false
        default: ''
      CONTAINER:
        description: 'Build container image'
        required: true
        default: 'fedora:40'

env:
  REPO: ${{ github.event.inputs.KREPO }}
  RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}
  KERNEL_BRANCH: ${{ github.event.inputs.KBRANCH }}
  NOTE: ${{ github.event.inputs.NOTES }}
  COMPILERS: ${{ github.event.inputs.COMPILER }}
  VERBOSE: ${{ github.event.inputs.VERBOSE }}
  zipper_repo: ${{ github.event.inputs.ZREPO }}
  zipper_branch: ${{ github.event.inputs.ZBRANCH }}
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event.inputs.CONTAINER }}

    steps:
        - name: checkout
          uses: actions/checkout@master

        - name: Prepare environment
          run: |
            grep -v -E "^#|^\n" config-xxksu.env | sed 's/ #.*//; s/#.*//' >> $GITHUB_ENV

        - name: record start time
          run: |
            echo WORKFLOW_START=$(date +"%s") >> $GITHUB_ENV

        - name: init build env
          run: |
            dnf group install development-tools -y
            dnf install llvm lld bc bison ca-certificates curl flex glibc-devel.i686 glibc-devel binutils-devel openssl python3 python2 zstd clang gcc-arm-linux-gnu dtc libxml2 libarchive openssl-devel perl tomsfastmath-devel wget xz -y
            ln -sf "/usr/bin/python3" /usr/bin/python
            
            # FIX LINKER 32-BIT (VDSO Error 127) di Fedora
            ln -sf /usr/bin/arm-linux-gnu-ld /usr/bin/arm-linux-gnueabi-ld
            ln -sf /usr/bin/arm-linux-gnu-gcc /usr/bin/arm-linux-gnueabi-gcc
            
            git config --global user.name "nakamasha-ichika"
            git config --global user.email "dickygunardi-alt@github.com"

        - name: show host info
          run: |
            if [ ! -z "$VERBOSE" ]; then
              echo "Host: $(cat /etc/os-release | grep PRETTY_NAME | cut -d'=' -f2)"
              echo "Free disk space: $(df --sync -BM --output=avail / | grep -v Avail)"
            fi

        - name: print notes if exists
          run: |
            if [ ! -z "$NOTE" ]; then
              echo "Note: $NOTE"
            fi

        - name: clone kernel source
          run: |
            echo "Cloning kernel from: $REPO (branch: $KERNEL_BRANCH)"
            git clone --depth=1 --single-branch --recurse-submodules -j4 $REPO -b $KERNEL_BRANCH kernel

        - name: print kernel info
          run: |
            cd kernel
            source ../env
            echo "Kernel name: ${kernel_name}"
            echo "Kernel ver:  ${kernel_ver}"
            echo "Head commit: ${kernel_head}"
            echo "Defconfig:   ${defconfig}"

        - name: Apply Configs and Patches (from env)
          run: |
            cd kernel
            source ../env
            
            # Temukan lokasi file defconfig
            DEFCONFIG_FILE=$(find arch -name "${defconfig}")
            
            # 1. Setup KernelSU dan Patches terkait
            if [ "${{ env.ENABLE_KERNELSU }}" == "true" ]; then
                echo "ENABLE_KERNELSU is true. Menyalin KernelSU..."
                curl -LSs "${{ env.KERNELSU_SETUP_SOURCE }}" | bash -s "${{ env.KERNELSU_TAG }}"
                
                if [ "${{ env.KSU_REVERT }}" == "true" ]; then
                    echo "Menerapkan KSU_REVERT.patch..."
                    git apply ../patches/KSU_REVERT.patch
                fi
                
                if [ "${{ env.KSU_HOOKS_PATCH }}" == "true" ]; then
                    echo "Menerapkan KSU_HOOKS_PATCH.patch..."
                    git apply ../patches/KSU_HOOKS_PATCH.patch
                    if grep -q "CONFIG_KSU" "$DEFCONFIG_FILE"; then
                        sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/g' "$DEFCONFIG_FILE"
                        sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' "$DEFCONFIG_FILE"
                    else
                        echo "CONFIG_KSU=y" >> "$DEFCONFIG_FILE"
                    fi
                fi
                
                if [ "${{ env.ADD_KPROBES_CONFIG }}" == "true" ] && [ "${{ env.KSU_HOOKS_PATCH }}" != "true" ]; then
                    echo "Menambahkan konfigurasi KPROBES..."
                    echo "CONFIG_MODULES=y" >> "$DEFCONFIG_FILE"
                    echo "CONFIG_KPROBES=y" >> "$DEFCONFIG_FILE"
                    echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG_FILE"
                    echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG_FILE"
                fi
                
                echo "Menambahkan susfs dan ekstensi konfigurasi KernelSU lainnya..."
                for config in CONFIG_KSU=y \
                              CONFIG_KSU_TAMPER_SYSCALL_TABLE=y \
                              CONFIG_KSU_SUSFS=y \
                              CONFIG_KSU_SUSFS_SUS_PATH=y \
                              CONFIG_KSU_SUSFS_SUS_MOUNT=y \
                              CONFIG_KSU_SUSFS_SUS_KSTAT=y \
                              CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
                              CONFIG_KSU_SUSFS_ENABLE_LOG=y \
                              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
                              CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
                              CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y \
                              CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
                              CONFIG_KSU_SUSFS_SUS_MAP=y
                do
                    echo "$config" >> "$DEFCONFIG_FILE"
                done
            fi
            
            # 2. Setup APatch Support
            if [ "${{ env.ADD_APATCH_SUPPORT }}" == "true" ]; then
                echo "ADD_APATCH_SUPPORT is true. Menyiapkan konfigurasi KALLSYMS..."
                sed -i 's/# CONFIG_DEBUG_KERNEL is not set/CONFIG_DEBUG_KERNEL=y/g' "$DEFCONFIG_FILE"
                sed -i 's/CONFIG_DEBUG_KERNEL=n/CONFIG_DEBUG_KERNEL=y/g' "$DEFCONFIG_FILE"
                echo "CONFIG_DEBUG_KERNEL=y" >> "$DEFCONFIG_FILE"
                sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/g' "$DEFCONFIG_FILE"
                sed -i 's/CONFIG_KALLSYMS=n/CONFIG_KALLSYMS=y/g' "$DEFCONFIG_FILE"
                echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG_FILE"
                sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/g' "$DEFCONFIG_FILE"
                sed -i 's/CONFIG_KALLSYMS_ALL=n/CONFIG_KALLSYMS_ALL=y/g' "$DEFCONFIG_FILE"
                echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG_FILE"
                sed -i 's/# CONFIG_KALLSYMS_BASE_RELATIVE is not set/CONFIG_KALLSYMS_BASE_RELATIVE=y/g' "$DEFCONFIG_FILE"
                sed -i 's/CONFIG_KALLSYMS_BASE_RELATIVE=n/CONFIG_KALLSYMS_BASE_RELATIVE=y/g' "$DEFCONFIG_FILE"
                echo "CONFIG_KALLSYMS_BASE_RELATIVE=y" >> "$DEFCONFIG_FILE"
                
                if [ "${{ env.FIX_APATCH_OPENELA }}" == "true" ]; then
                    echo "Menerapkan FIX_APATCH_OPENELA.patch..."
                    git apply ../patches/FIX_APATCH_OPENELA.patch || {
                        echo "Patch gagal, mencoba REVERT_ADD_GET_CRED_RCU.patch terlebih dahulu..."
                        git apply ../patches/REVERT_ADD_GET_CRED_RCU.patch
                        git apply ../patches/FIX_APATCH_OPENELA.patch
                    }
                fi
            fi

        - name: Fix MediaTek Type-C Compilation Error
          run: |
            cd kernel
            echo "========================================"
            echo "Menambal Makefile MTK Type-C agar mengabaikan error Clang..."
            echo "========================================"
            
            TCPC_MAKE="drivers/misc/mediatek/typec/tcpc/Makefile"
            TYPEC_MAKE="drivers/misc/mediatek/typec/Makefile"
            
            # Patch folder tcpc
            if [ -f "$TCPC_MAKE" ]; then
              sed -i 's/-Werror//g' "$TCPC_MAKE"
              echo "ccflags-y += -Wno-error" >> "$TCPC_MAKE"
              echo "ccflags-y += -Wno-incompatible-pointer-types" >> "$TCPC_MAKE"
              echo "ccflags-y += -Wno-unused-variable" >> "$TCPC_MAKE"
              echo "ccflags-y += -Wno-implicit-int" >> "$TCPC_MAKE"
              echo "ccflags-y += -Wno-pointer-sign" >> "$TCPC_MAKE"
              echo "✅ Patch tcpc Makefile sukses"
            fi
            
            # Patch folder typec parent
            if [ -f "$TYPEC_MAKE" ]; then
              sed -i 's/-Werror//g' "$TYPEC_MAKE"
              echo "ccflags-y += -Wno-error" >> "$TYPEC_MAKE"
              echo "ccflags-y += -Wno-incompatible-pointer-types" >> "$TYPEC_MAKE"
              echo "✅ Patch typec Makefile sukses"
            fi

        - name: run compilation
          run: |
            cd kernel
            # FIX LINKER COMPAT: Memaksa Makefile VDSO menggunakan clang/lld agar tidak error
            export LD_COMPAT=ld.lld
            export CC_COMPAT=clang
            bash ../build.sh "$COMPILERS"

        - name: upload artifacts
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: kernel-${{ github.run_number }}-${{ github.run_attempt }}
            path: |
              kernel/*.zip
              kernel/*.log
            if-no-files-found: warn
            retention-days: 7

        - name: print build result
          if: always()
          run: |
            WORKFLOW_END=$(date +"%s")
            WDIFF=$((WORKFLOW_END - WORKFLOW_START))
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Build succeeded in $((WDIFF / 60))m $((WDIFF % 60))s"
            else
              echo "❌ Build failed in $((WDIFF / 60))m $((WDIFF % 60))s"
            fi
