name: Building kernel
run-name: "Building kernel (${{ inputs.KBRANCH }}) #${{ github.run_number }}${{ inputs.NOTES && format(' - {0}', inputs.NOTES) || '' }}"

on:
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'Compiler to use'
        required: true
        default: 'Neutron-Clang'
      KREPO:
        description: 'Kernel repo URL'
        required: true
        default: 'https://github.com/dickygunardi388-alt/android_kernel_xiaomi_selene'
      KBRANCH:
        description: 'Kernel branch'
        required: true
        default: '4.14ksun-susfs'
      KSU:
        description: 'KSU patch script to run (e.g. applyPatches.sh, applyPatches-ksun.sh, or leave blank for no KSU)'
        required: false
        default: ''
      ksu_version:
        description: 'KernelSU-Next version (untuk kernel 4.14)'
        required: false
        default: 'v3.3.0'
        type: choice
        options:
          - v3.3.0
          - v3.2.0-legacy
          - legacy
          - v3.1.0-legacy
          - v3.1.0
      NOTES:
        description: 'Extra notes (printed in build log)'
        required: false
        default: ''
      VERBOSE:
        description: 'Enable verbose logging (leave blank to disable)'
        required: false
        default: ''
      ZREPO:
        description: 'Custom AnyKernel3 repo (leave blank = use default from env)'
        required: false
        default: ''
      ZBRANCH:
        description: 'Custom AnyKernel3 branch (leave blank = use default from env)'
        required: false
        default: ''
      CONTAINER:
        description: 'Build container image'
        required: true
        default: 'fedora:40'

env:
  REPO: ${{ github.event.inputs.KREPO }}
  RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}
  KERNEL_BRANCH: ${{ github.event.inputs.KBRANCH }}
  PATCH_KSU: ${{ github.event.inputs.KSU }}
  NOTE: ${{ github.event.inputs.NOTES }}
  COMPILERS: ${{ github.event.inputs.COMPILER }}
  VERBOSE: ${{ github.event.inputs.VERBOSE }}
  zipper_repo: ${{ github.event.inputs.ZREPO }}
  zipper_branch: ${{ github.event.inputs.ZBRANCH }}
  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
  TZ: Asia/Jakarta
  # KPM (KernelPatch Module) support — embed KPM ke Image hasil build
  ADD_KPM_SUPPORT: true
  KPM_PATCH_URL: https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.12.2/patch_linux

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event.inputs.CONTAINER }}

    steps:
        - name: checkout
          uses: actions/checkout@master

        - name: record start time
          run: |
            echo WORKFLOW_START=$(date +"%s") >> $GITHUB_ENV

        - name: init build env
          run: |
            dnf group install development-tools -y
            dnf install llvm lld bc bison ca-certificates curl flex glibc-devel.i686 glibc-devel binutils-devel openssl python3 python2 zstd clang gcc-arm-linux-gnu dtc libxml2 libarchive openssl-devel perl tomsfastmath-devel wget xz -y
            ln -sf "/usr/bin/python3" /usr/bin/python
            
            # FIX LINKER 32-BIT (VDSO Error 127) di Fedora
            ln -sf /usr/bin/arm-linux-gnu-ld /usr/bin/arm-linux-gnueabi-ld
            ln -sf /usr/bin/arm-linux-gnu-gcc /usr/bin/arm-linux-gnueabi-gcc
            
            git config --global user.name "nakamasha-ichika"
            git config --global user.email "dickygunardi-alt@github.com"

        - name: show host info
          run: |
            if [ ! -z "$VERBOSE" ]; then
              echo "Host: $(cat /etc/os-release | grep PRETTY_NAME | cut -d'=' -f2)"
              echo "Free disk space: $(df --sync -BM --output=avail / | grep -v Avail)"
            fi

        - name: print notes if exists
          run: |
            if [ ! -z "$NOTE" ]; then
              echo "Note: $NOTE"
            fi

        - name: validate KSU + branch combination
          run: |
            if [ -n "$PATCH_KSU" ]; then
              if [ "$PATCH_KSU" = "applyPatches-ksun.sh" ] && ! echo "$KERNEL_BRANCH" | grep -q "ksun"; then
                echo "❌ ERROR: applyPatches-ksun.sh requires a KernelSU-Next branch (e.g. Hydrogen)."
                exit 1
              elif [ "$PATCH_KSU" = "applyPatches.sh" ] && ! echo "$KERNEL_BRANCH" | grep -q "rssu"; then
                echo "❌ ERROR: applyPatches.sh requires a ReSukiSU branch (e.g. 4.14-rssu)."
                exit 1
              fi
            fi

        - name: clone kernel source
          run: |
            echo "Cloning kernel from: $REPO (branch: $KERNEL_BRANCH)"
            git clone --depth=1 --single-branch --recurse-submodules -j4 $REPO -b $KERNEL_BRANCH kernel

        - name: Update/Patch KernelSU-Next
          run: |
            cd kernel
            
            KSU_VERSION="${{ github.event.inputs.ksu_version }}"
            if [ -z "$KSU_VERSION" ]; then
              KSU_VERSION="v3.3.0"
            fi
            
            echo "========================================"
            echo "KernelSU-Next Setup"
            echo "========================================"
            echo "Kernel Version: 4.14"
            echo "KernelSU-Next Version: $KSU_VERSION"
            echo "Repository: KernelSU-Next/KernelSU-Next"
            echo "========================================"
            
            if [ -d "KernelSU-Next" ]; then
              echo "Removing old KernelSU-Next directory..."
              rm -rf KernelSU-Next
            fi
            
            echo "Cloning KernelSU-Next ($KSU_VERSION)..."
            if git clone --depth=1 -b "$KSU_VERSION" "${{ env.KSU_REPO }}" KernelSU-Next 2>&1; then
              echo "✓ KernelSU-Next cloned successfully (branch: $KSU_VERSION)"
            else
              echo "❌ Failed to clone branch $KSU_VERSION, trying main branch..."
              rm -rf KernelSU-Next
              git clone --depth=1 -b main "${{ env.KSU_REPO }}" KernelSU-Next
            fi
            
            echo "Cleaning kernel output directory..."
            rm -rf out 2>/dev/null || true
            
            echo "Applying KernelSU-Next patches..."
            if [ -f "KernelSU-Next/kernel/setup.sh" ]; then
              chmod +x KernelSU-Next/kernel/setup.sh
              bash KernelSU-Next/kernel/setup.sh
            else
              if find KernelSU-Next/kernel -name "*.patch" -type f 2>/dev/null | head -1 > /dev/null; then
                for patch in KernelSU-Next/kernel/*.patch; do
                  patch -p1 < "$patch" || true
                done
              fi
            fi

        - name: print kernel info
          run: |
            cd kernel
            source ../env
            echo "Kernel name: ${kernel_name}"
            echo "Kernel ver:  ${kernel_ver}"
            echo "Head commit: ${kernel_head}"
            echo "Defconfig:   ${defconfig}"
            echo "KSU mode:    ${PATCH_KSU:-none}"

        - name: apply KSU patch
          if: env.PATCH_KSU != ''
          run: |
            cd kernel
            bash ../ksu/$PATCH_KSU

        - name: Fix MediaTek Type-C Compilation Error
          run: |
            cd kernel
            echo "========================================"
            echo "Menambal Makefile MTK Type-C agar mengabaikan error Clang..."
            echo "========================================"
            
            TCPC_MAKE="drivers/misc/mediatek/typec/tcpc/Makefile"
            TYPEC_MAKE="drivers/misc/mediatek/typec/Makefile"
            
            # Patch folder tcpc
            if [ -f "$TCPC_MAKE" ]; then
              sed -i 's/-Werror//g' "$TCPC_MAKE"
              echo "ccflags-y += -Wno-error" >> "$TCPC_MAKE"
              echo "ccflags-y += -Wno-incompatible-pointer-types" >> "$TCPC_MAKE"
              echo "ccflags-y += -Wno-unused-variable" >> "$TCPC_MAKE"
              echo "ccflags-y += -Wno-implicit-int" >> "$TCPC_MAKE"
              echo "ccflags-y += -Wno-pointer-sign" >> "$TCPC_MAKE"
              echo "✅ Patch tcpc Makefile sukses"
            fi
            
            # Patch folder typec parent
            if [ -f "$TYPEC_MAKE" ]; then
              sed -i 's/-Werror//g' "$TYPEC_MAKE"
              echo "ccflags-y += -Wno-error" >> "$TYPEC_MAKE"
              echo "ccflags-y += -Wno-incompatible-pointer-types" >> "$TYPEC_MAKE"
              echo "✅ Patch typec Makefile sukses"
            fi

        - name: run compilation
          run: |
            cd kernel
            # FIX LINKER COMPAT: Memaksa Makefile VDSO menggunakan clang/lld agar tidak error
            export LD_COMPAT=ld.lld
            export CC_COMPAT=clang
            bash ../build.sh "$COMPILERS"

         if [ "$ADD_KPM_SUPPORT" == "true" ]; then
            NAME="${NAME}-KPM"
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"


        - name: upload artifacts
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: kernel-${{ github.run_number }}-${{ github.run_attempt }}
            path: |
              kernel/*.zip
              kernel/*.log
            if-no-files-found: warn
            retention-days: 7

        - name: print build result
          if: always()
          run: |
            WORKFLOW_END=$(date +"%s")
            WDIFF=$((WORKFLOW_END - WORKFLOW_START))
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Build succeeded in $((WDIFF / 60))m $((WDIFF % 60))s"
            else
              echo "❌ Build failed in $((WDIFF / 60))m $((WDIFF % 60))s"
            fi
